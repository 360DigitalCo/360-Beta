<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>360Do</title>
  <link rel="icon" type="image/png" href="/favicon-32x32.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#ff5c7b" />
  <link rel="stylesheet" href="/assets/css/main.css" />
  <link rel="stylesheet" href="/assets/css/wide.css" />
  <link rel="stylesheet" href="/assets/css/responsive.css" />
  <link rel="stylesheet" href="/assets/css/cursor.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #05060a;
      color: #f5f5f5;
      overflow: hidden;
    }

    .do-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    .do-topbar {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: rgba(10, 12, 20, 0.9);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(18px);
    }

    .do-topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .do-logo {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: radial-gradient(circle at 20% 20%, #ffb347, #ff5c7b);
    }

    .do-title {
      font-size: 14px;
      opacity: 0.9;
    }

    .do-topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      opacity: 0.8;
    }

    .do-share-btn {
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.04);
      color: #f5f5f5;
      font-size: 12px;
      cursor: pointer;
    }

    .do-main {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    .do-sidebar {
      width: 220px;
      background: rgba(10, 12, 20, 0.96);
      border-right: 1px solid rgba(255, 255, 255, 0.06);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 13px;
      overflow-y: auto;
    }

    .do-sidebar-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.6;
      margin-bottom: 4px;
    }

    .do-list-item {
      padding: 6px 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.02);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .do-list-item.active {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    .do-list-item-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .do-list-badge {
      font-size: 11px;
      opacity: 0.7;
    }

    .do-list-del {
      border: none;
      background: transparent;
      color: #f5f5f5;
      opacity: 0.4;
      cursor: pointer;
      font-size: 11px;
      padding: 2px 4px;
      border-radius: 4px;
      line-height: 1;
    }
    .do-list-del:hover { opacity: 1; background: rgba(255,92,123,0.2); }

    .do-new-list {
      margin-top: 4px;
      font-size: 12px;
      opacity: 0.8;
      cursor: pointer;
    }
    .do-new-list:hover { opacity: 1; }

    .do-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at top, #151827, #05060a);
      padding: 16px;
      gap: 12px;
      overflow: hidden;
    }

    .do-list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .do-list-title {
      font-size: 20px;
      font-weight: 600;
    }

    .do-list-meta {
      font-size: 12px;
      opacity: 0.7;
    }

    .do-share-pill {
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .do-items {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
      margin-top: 8px;
    }

    .do-empty {
      opacity: 0.55;
      font-size: 13px;
      text-align: center;
      padding: 40px 10px;
    }

    .do-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.02);
      margin-bottom: 6px;
    }

    .do-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .do-item-text {
      flex: 1;
      font-size: 14px;
      word-break: break-word;
    }

    .do-item-text.completed {
      text-decoration: line-through;
      opacity: 0.6;
    }

    .do-item-meta {
      font-size: 11px;
      opacity: 0.6;
      flex-shrink: 0;
    }

    .do-item-del {
      border: none;
      background: transparent;
      color: #f5f5f5;
      opacity: 0;
      cursor: pointer;
      font-size: 13px;
      padding: 2px 6px;
      border-radius: 6px;
      flex-shrink: 0;
      transition: opacity .12s;
    }
    .do-item:hover .do-item-del { opacity: 0.5; }
    .do-item-del:hover { opacity: 1 !important; background: rgba(255,92,123,0.2); }

    .do-new-item {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
    }

    .do-new-item input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: #f5f5f5;
      font-size: 14px;
    }

    .do-new-item button {
      border: none;
      background: rgba(255, 255, 255, 0.12);
      color: #f5f5f5;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .do-new-item button:disabled { opacity: 0.5; cursor: default; }

    .do-bottom-bar {
      height: 32px;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      opacity: 0.7;
    }

    /* ---- signed-out gate ---- */
    .do-gate {
      flex: 1;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      padding: 24px;
    }
    .do-gate-icon { font-size: 38px; }
    .do-gate-title { font-size: 18px; font-weight: 600; }
    .do-gate-sub { font-size: 13px; opacity: 0.65; max-width: 280px; }
    .do-gate-btn {
      margin-top: 6px;
      border: none;
      background: linear-gradient(120deg, #ffb347, #ff5c7b);
      color: #05060a;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 13px;
    }

    /* ---- toast ---- */
    .do-toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(20, 22, 32, 0.96);
      border: 1px solid rgba(255,255,255,0.12);
      color: #f5f5f5;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
      z-index: 999;
    }
    .do-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body class="dark">
  <div class="auth-top-right">
    <button id="signInBtn" class="auth-btn">Sign In</button>
    <button id="signUpBtn" class="auth-btn">Sign Up</button>
    <button id="signOutBtn" class="auth-btn" style="display:none;">Sign Out</button>
  </div>

  <div class="do-shell">
    <div class="do-topbar">
      <div class="do-topbar-left">
        <div class="do-logo"></div>
        <div class="do-title">360Do · Lists & Tasks</div>
      </div>
      <div class="do-topbar-right">
        <button class="do-share-btn" onclick="window.location.href='/apps'">← Apps</button>
        <span id="do-sync-status">●&nbsp;Synced</span>
        <button class="do-share-btn" id="do-share-btn">Share list</button>
      </div>
    </div>

    <div class="do-main" id="do-main">
      <div class="do-sidebar">
        <div style="flex:1; display:flex; flex-direction:column;">
          <div class="do-sidebar-title">Lists</div>
          <div id="do-list-rail"></div>
        </div>
        <div class="do-new-list" id="do-new-list">+ New list</div>
      </div>

      <div class="do-content">
        <div class="do-list-header">
          <div>
            <div class="do-list-title" id="do-list-title">Inbox</div>
            <div class="do-list-meta">Synced to your 360 account</div>
          </div>
          <div class="do-share-pill">
            <span>👥</span>
            <span id="do-share-label">Not shared</span>
          </div>
        </div>

        <div class="do-items" id="do-items"></div>

        <div class="do-new-item">
          <input id="do-new-item-input" placeholder="Add a task..." />
          <button id="do-add-item-btn">Add</button>
        </div>

        <div class="do-bottom-bar">
          <span id="do-count">0 items</span>
          <span>List sharing coming soon</span>
        </div>
      </div>
    </div>

    <div class="do-gate" id="do-gate">
      <div class="do-gate-icon">✅</div>
      <div class="do-gate-title">Sign in to use 360Do</div>
      <div class="do-gate-sub">Your lists and tasks save to your 360 account and sync across every device.</div>
      <button class="do-gate-btn" id="do-gate-signin">Sign In</button>
    </div>
  </div>

  <div class="do-toast" id="do-toast"></div>

  <script>
    // --- Supabase client (same project as the rest of 360) ---
    const SUPABASE_URL  = 'https://wiswfpfsjiowtrdyqpxy.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indpc3dmcGZzamlvd3RyZHlxcHh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgzMzg4OTcsImV4cCI6MjA4MzkxNDg5N30.z_4FtM2c8UwgrRlafPYjolQuod4IoHQats95XHio1zM';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    const DEFAULT_LISTS = [
      { name: 'Inbox', default_key: 'inbox', position: 0 },
      { name: 'Today', default_key: 'today', position: 1 },
      { name: 'Ideas', default_key: 'ideas', position: 2 },
    ];

    let currentUser = null;
    let lists = [];
    let allTasks = [];
    let currentListId = null;
    let tasksChannel = null;

    const mainEl = document.getElementById('do-main');
    const gateEl = document.getElementById('do-gate');
    const railEl = document.getElementById('do-list-rail');
    const itemsEl = document.getElementById('do-items');
    const countEl = document.getElementById('do-count');
    const titleEl = document.getElementById('do-list-title');
    const newInput = document.getElementById('do-new-item-input');
    const addBtn = document.getElementById('do-add-item-btn');
    const toastEl = document.getElementById('do-toast');
    const syncStatusEl = document.getElementById('do-sync-status');

    function showToast(msg, dur = 2400) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastEl._t);
      toastEl._t = setTimeout(() => toastEl.classList.remove('show'), dur);
    }

    function escHtml(str) {
      return String(str || '')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;');
    }

    function timeAgo(ts) {
      if (!ts) return '';
      const diff = Date.now() - new Date(ts).getTime();
      const m = Math.floor(diff / 60000);
      if (m < 1) return 'just now';
      if (m < 60) return m + 'm ago';
      const h = Math.floor(m / 60);
      if (h < 24) return h + 'h ago';
      const d = Math.floor(h / 24);
      return d + 'd ago';
    }

    function showGate(show) {
      gateEl.style.display = show ? 'flex' : 'none';
      mainEl.style.display = show ? 'none' : 'flex';
    }

    /* ---------------- data layer ---------------- */

    async function ensureDefaultLists() {
      const { data, error } = await sb.from('task_lists').select('id').eq('user_id', currentUser.id).limit(1);
      if (error) { console.error(error); return; }
      if (data && data.length) return;
      const rows = DEFAULT_LISTS.map(l => ({ ...l, user_id: currentUser.id, is_default: true }));
      const { error: insErr } = await sb.from('task_lists').insert(rows);
      if (insErr) console.error(insErr);
    }

    async function loadLists() {
      const { data, error } = await sb.from('task_lists')
        .select('*')
        .eq('user_id', currentUser.id)
        .order('position', { ascending: true })
        .order('created_at', { ascending: true });
      if (error) { showToast('Could not load lists'); return; }
      lists = data || [];
    }

    async function loadAllTasks() {
      const { data, error } = await sb.from('tasks')
        .select('*')
        .eq('user_id', currentUser.id)
        .order('position', { ascending: true })
        .order('created_at', { ascending: true });
      if (error) { showToast('Could not load tasks'); return; }
      allTasks = data || [];
    }

    function tasksForList(listId) {
      return allTasks.filter(t => t.list_id === listId);
    }

    /* ---------------- realtime (cross-tab / cross-device sync) ---------------- */

    function subscribeRealtime() {
      if (tasksChannel) sb.removeChannel(tasksChannel);
      tasksChannel = sb.channel('do-sync-' + currentUser.id)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks', filter: `user_id=eq.${currentUser.id}` }, handleTaskChange)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'task_lists', filter: `user_id=eq.${currentUser.id}` }, handleListChange)
        .subscribe(status => {
          syncStatusEl.textContent = status === 'SUBSCRIBED' ? '●  Synced' : '○  Connecting…';
        });
    }

    function teardownRealtime() {
      if (tasksChannel) { sb.removeChannel(tasksChannel); tasksChannel = null; }
    }

    function handleTaskChange(payload) {
      if (payload.eventType === 'INSERT') {
        if (!allTasks.find(t => t.id === payload.new.id)) allTasks.push(payload.new);
      } else if (payload.eventType === 'UPDATE') {
        const idx = allTasks.findIndex(t => t.id === payload.new.id);
        if (idx > -1) allTasks[idx] = payload.new;
      } else if (payload.eventType === 'DELETE') {
        allTasks = allTasks.filter(t => t.id !== payload.old.id);
      }
      renderSidebar();
      renderTasks();
    }

    function handleListChange(payload) {
      if (payload.eventType === 'INSERT') {
        if (!lists.find(l => l.id === payload.new.id)) lists.push(payload.new);
      } else if (payload.eventType === 'UPDATE') {
        const idx = lists.findIndex(l => l.id === payload.new.id);
        if (idx > -1) lists[idx] = payload.new;
      } else if (payload.eventType === 'DELETE') {
        lists = lists.filter(l => l.id !== payload.old.id);
        if (currentListId === payload.old.id) currentListId = lists[0]?.id || null;
      }
      renderSidebar();
      renderTasks();
    }

    /* ---------------- rendering ---------------- */

    function renderSidebar() {
      railEl.innerHTML = lists.map(l => {
        const undone = tasksForList(l.id).filter(t => !t.done).length;
        return `
          <div class="do-list-item ${l.id === currentListId ? 'active' : ''}" data-list-id="${l.id}">
            <span class="do-list-item-name">${escHtml(l.name)}</span>
            <span class="do-list-badge">${undone}</span>
            ${l.is_default ? '' : `<button class="do-list-del" data-del-list="${l.id}" title="Delete list">✕</button>`}
          </div>`;
      }).join('');

      railEl.querySelectorAll('.do-list-item').forEach(el => {
        el.addEventListener('click', (e) => {
          if (e.target.closest('.do-list-del')) return;
          selectList(el.dataset.listId);
        });
      });
      railEl.querySelectorAll('.do-list-del').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          deleteList(el.dataset.delList);
        });
      });
    }

    function renderTasks() {
      const list = lists.find(l => l.id === currentListId);
      titleEl.textContent = list ? list.name : 'No list selected';

      const items = currentListId ? tasksForList(currentListId) : [];

      if (!items.length) {
        itemsEl.innerHTML = `<div class="do-empty">No tasks yet. Add one below.</div>`;
      } else {
        itemsEl.innerHTML = '';
        items.forEach(item => {
          const row = document.createElement('div');
          row.className = 'do-item';

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = item.done;
          checkbox.addEventListener('change', () => toggleDone(item, checkbox.checked));

          const text = document.createElement('div');
          text.className = 'do-item-text' + (item.done ? ' completed' : '');
          text.textContent = item.text;

          const meta = document.createElement('div');
          meta.className = 'do-item-meta';
          meta.textContent = timeAgo(item.created_at);

          const del = document.createElement('button');
          del.className = 'do-item-del';
          del.title = 'Delete task';
          del.textContent = '✕';
          del.addEventListener('click', () => deleteItem(item));

          row.appendChild(checkbox);
          row.appendChild(text);
          row.appendChild(meta);
          row.appendChild(del);
          itemsEl.appendChild(row);
        });
      }

      countEl.textContent = `${items.length} item${items.length === 1 ? '' : 's'}`;
    }

    /* ---------------- actions ---------------- */

    async function selectList(id) {
      currentListId = id;
      renderSidebar();
      renderTasks();
    }

    async function addItem() {
      const text = newInput.value.trim();
      if (!text || !currentListId || !currentUser) return;
      newInput.value = '';
      addBtn.disabled = true;
      const { data, error } = await sb.from('tasks')
        .insert({ user_id: currentUser.id, list_id: currentListId, text })
        .select()
        .single();
      addBtn.disabled = false;
      if (error) { showToast('Could not add task'); return; }
      if (!allTasks.find(t => t.id === data.id)) allTasks.push(data);
      renderSidebar();
      renderTasks();
      newInput.focus();
    }

    async function toggleDone(item, checked) {
      const prev = item.done;
      item.done = checked;
      renderSidebar();
      renderTasks();
      const { error } = await sb.from('tasks').update({ done: checked }).eq('id', item.id);
      if (error) {
        item.done = prev;
        renderSidebar();
        renderTasks();
        showToast('Could not update task');
      }
    }

    async function deleteItem(item) {
      allTasks = allTasks.filter(t => t.id !== item.id);
      renderSidebar();
      renderTasks();
      const { error } = await sb.from('tasks').delete().eq('id', item.id);
      if (error) showToast('Could not delete task');
    }

    async function addList() {
      const name = prompt('New list name:');
      if (!name || !name.trim()) return;
      const position = lists.length;
      const { data, error } = await sb.from('task_lists')
        .insert({ user_id: currentUser.id, name: name.trim(), is_default: false, position })
        .select()
        .single();
      if (error) { showToast('Could not create list'); return; }
      if (!lists.find(l => l.id === data.id)) lists.push(data);
      currentListId = data.id;
      renderSidebar();
      renderTasks();
    }

    async function deleteList(listId) {
      const list = lists.find(l => l.id === listId);
      if (!list || list.is_default) return;
      if (!confirm(`Delete list "${list.name}" and all its tasks? This can't be undone.`)) return;
      lists = lists.filter(l => l.id !== listId);
      allTasks = allTasks.filter(t => t.list_id !== listId);
      if (currentListId === listId) currentListId = lists[0]?.id || null;
      renderSidebar();
      renderTasks();
      const { error } = await sb.from('task_lists').delete().eq('id', listId);
      if (error) showToast('Could not delete list');
    }

    /* ---------------- boot / auth ---------------- */

    async function boot() {
      await ensureDefaultLists();
      await loadLists();
      await loadAllTasks();
      if (!currentListId || !lists.find(l => l.id === currentListId)) {
        currentListId = (lists.find(l => l.default_key === 'inbox') || lists[0])?.id || null;
      }
      renderSidebar();
      renderTasks();
      subscribeRealtime();
    }

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      currentUser = session?.user ?? null;
      if (currentUser) {
        showGate(false);
        await boot();
      } else {
        showGate(true);
      }

      sb.auth.onAuthStateChange(async (_event, session) => {
        const wasSignedIn = !!currentUser;
        currentUser = session?.user ?? null;
        if (currentUser && !wasSignedIn) {
          showGate(false);
          await boot();
        } else if (!currentUser && wasSignedIn) {
          teardownRealtime();
          lists = [];
          allTasks = [];
          currentListId = null;
          showGate(true);
        }
      });
    }

    addBtn.addEventListener('click', addItem);
    newInput.addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });
    document.getElementById('do-new-list').addEventListener('click', addList);
    document.getElementById('do-gate-signin').addEventListener('click', () => {
      window.location.href = '/signin?from=' + encodeURIComponent(window.location.pathname);
    });
    document.getElementById('do-share-btn').addEventListener('click', () => {
      alert('List sharing will use invite links + roles (viewer/editor) — coming soon.');
    });

    init();
  </script>

  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/wide.js"></script>
  <script src="/assets/js/cookie.js"></script>
  <script src="/assets/js/cursor.js"></script>
</body>
</html>
